name: CI/CD

# One workflow for the whole repo. Each part (backend, frontend) only runs when its files change,
# and the final "CI result" job always reports, so it can be the single required check on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going.
# Runs on main are never cancelled, so a deployment is not interrupted halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smartledger-api
  AZURE_RESOURCE_GROUP: rg-smartledger
  AZURE_CONTAINER_APP: ca-smartledger-api
  FRONTEND_DIST: frontend/dist/smartledger-web/browser

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  # ---------------- Backend ----------------

  backend-build-test:
    name: Backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore SmartLedger.slnx

      - name: Build
        run: dotnet build SmartLedger.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SmartLedger.slnx --configuration Release --no-build

  backend-docker:
    name: Backend Docker image
    needs: backend-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pull requests only check that the image builds; pushes to main publish it.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-deploy:
    name: Backend deploy to Azure
    needs: backend-docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets azure/login exchange GitHub's OIDC token for Azure access, no stored password
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploy the image built from this exact commit, not "latest", so every revision maps to a commit.
      - name: Update Container App image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          image="${IMAGE_NAME,,}:sha-${GITHUB_SHA}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$image" \
            --output none
          echo "Deployed $image"

      - name: Get app URL
        id: app
        run: |
          fqdn=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # The app may be starting from zero replicas, so allow time for a cold start.
      - name: Smoke test /health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-all-errors --max-time 30 \
            "${{ steps.app.outputs.url }}/health"

  # ---------------- Frontend ----------------

  frontend-build-test:
    name: Frontend build and test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIST }}
          if-no-files-found: error

  frontend-deploy:
    name: Frontend deploy to Azure
    needs: frontend-build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      # The app is already built and tested, so Static Web Apps only uploads the files.
      - name: Deploy to Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  # ---------------- Summary ----------------

  ci-result:
    name: CI result
    needs:
      - changes
      - backend-build-test
      - backend-docker
      - backend-deploy
      - frontend-build-test
      - frontend-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (nothing changed in that part) count as passing; failed or cancelled ones do not.
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were skipped."
