<p class="api-status mono" [attr.data-status]="server.state()" aria-live="polite">
  @switch (server.state()) {
    @case ('checking') {
      SERVER · CONNECTING
    }
    @case ('waking') {
      SERVER · WAKING UP, UP TO A MINUTE
    }
    @case ('ready') {
      SERVER · ONLINE
    }
    @case ('unreachable') {
      SERVER · UNREACHABLE
      <button type="button" class="api-status__retry" (click)="server.retry()">Retry</button>
    }
  }
</p>
