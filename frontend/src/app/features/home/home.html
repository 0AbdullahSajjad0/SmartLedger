<section class="home">
  <h1>SmartLedger</h1>
  <p class="tagline">AI-powered expense and invoice manager</p>

  <div class="api-status" [attr.data-status]="status()" aria-live="polite">
    @switch (status()) {
      @case ('checking') {
        <span>Checking API…</span>
      }
      @case ('waking') {
        <span>Waking up the server… this can take up to 30 seconds.</span>
      }
      @case ('online') {
        <span>API online</span>
      }
      @case ('offline') {
        <span>API unreachable</span>
        <button type="button" (click)="checkApi()">Retry</button>
      }
    }
  </div>
</section>
