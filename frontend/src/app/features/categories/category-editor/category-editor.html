<td colspan="6" (keydown)="onKeydown($event)">
  <form class="editor__form" [formGroup]="form" (ngSubmit)="save()" novalidate
    [attr.aria-label]="category() ? 'Edit ' + category()!.name : 'New category'">
    <div class="field editor__name">
      <label class="label" [for]="'category-name-' + (category()?.id ?? 'new')">Name</label>
      <input [id]="'category-name-' + (category()?.id ?? 'new')" class="field__input editor__text" formControlName="name"
        [maxlength]="maxLength" autocomplete="off" [attr.aria-invalid]="nameInvalid()" />
      @if (nameInvalid()) {
        <span class="field__error">Give the category a name.</span>
      }
    </div>

    <fieldset class="editor__colours">
      <legend class="label">Colour</legend>
      <div class="swatches">
        @for (swatch of palette; track swatch.color) {
          <label class="swatch" [title]="swatch.name">
            <input type="radio" class="visually-hidden" formControlName="color" [value]="swatch.color" [attr.value]="swatch.color" />
            <span class="swatch__chip" [style.background]="swatch.color"></span>
            <span class="visually-hidden">{{ swatch.name }}</span>
          </label>
        }
      </div>
    </fieldset>

    <div class="field editor__budget">
      <label class="label" [for]="'category-budget-' + (category()?.id ?? 'new')">Monthly budget, {{ baseCurrency() }}</label>
      <input [id]="'category-budget-' + (category()?.id ?? 'new')" class="field__input" type="number" step="0.01" min="0"
        inputmode="decimal" formControlName="monthlyBudget" placeholder="No budget" />
    </div>

    <div class="editor__actions">
      <button type="submit" class="btn" [disabled]="busy()">{{ busy() ? 'Saving…' : category() ? 'Save' : 'Add category' }}</button>
      <button type="button" class="link-button link-button--muted" [disabled]="busy()" (click)="cancelled.emit()">Cancel</button>
      @if (category() && !category()!.isArchived) {
        <button type="button" class="link-button link-button--muted editor__archive" [disabled]="busy()" (click)="archive()">
          Archive
        </button>
      }
    </div>

    @if (error(); as message) {
      <p class="form-alert editor__alert" role="alert">{{ message }}</p>
    }
  </form>
</td>
