<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- SmartLedger mark: a ledger page with a terra cotta margin rule, ruled entries and a double-ruled total.
       Shapes sit on even coordinates so edges stay sharp at 16 px. -->
  <rect width="32" height="32" fill="#1c1a17"/>
  <rect x="6" y="4" width="20" height="24" fill="#f4efe4"/>
  <rect x="10" y="4" width="2" height="24" fill="#a84b26"/>
  <g fill="#1c1a17">
    <rect x="14" y="8" width="8" height="2"/>
    <rect x="14" y="12" width="8" height="2"/>
    <rect x="14" y="16" width="5" height="2"/>
    <rect x="14" y="20" width="8" height="1"/>
    <rect x="14" y="22" width="8" height="1"/>
  </g>
</svg>
